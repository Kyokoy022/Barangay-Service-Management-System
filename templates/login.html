{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Barangay Service Management System</h1>
  <p class="muted">Log in to request documents and book appointments.</p>
  <form method="post">
    {{ csrf_field() }}
    <label for="username">Username</label>
    <input id="username" name="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <p><button type="submit">Log in</button></p>
  </form>
  <p>New resident? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
